            {"id":"IND_046","dim":"推動校務研究","group":"數據驅動教學創新","cat":"共同","name":"利用校務研究改善教學與學習成效之報告件數","cycle":"年度","unit":"件","type":"量化","note":""},
            {"id":"IND_047","dim":"推動校務研究","group":"數據驅動教學創新","cat":"共同","name":"校務研究分析應用於教務決策之具體案例描述","cycle":"學期","unit":"","type":"質化","note":""},
            {"id":"IND_048","dim":"推動校務研究","group":"數據驅動教學創新","cat":"自訂","name":"教務數據指標視覺化儀表板建置數","cycle":"年度","unit":"個","type":"量化","note":""},
            {"id":"IND_049","dim":"推動校務研究","group":"數據驅動教學創新","cat":"自訂","name":"定期進行學生學習成效分析之報告公開數","cycle":"年度","unit":"份","type":"量化","note":""}
        ];

        // 系統狀態
        let currentMonthKey = "115-08";
        let currentDimFilter = "ALL";
        let isQualitativeLocked = true; 
        let storeData = {};

        // 週期資訊計算
        function getCycleInfo(monthKey) {
            const [yStr, mStr] = monthKey.split('-');
            const yearNum = parseInt(yStr, 10);
            const monthNum = parseInt(mStr, 10);

            let sem = "", acad = "", yr = `${yearNum}年度`;

            if (yearNum === 115) {
                sem = "115-1 學期";
                acad = "115學年度";
            } else if (yearNum === 116) {
                if (monthNum === 1) {
                    sem = "115-1 學期";
                    acad = "115學年度";
                } else if (monthNum >= 2 && monthNum <= 7) {
                    sem = "115-2 學期";
                    acad = "115學年度";
                } else {
                    sem = "116-1 學期";
                    acad = "116學年度";
                }
            }
            return { sem, acad, yr, monthNum, yearNum };
        }

        // 月份切換事件
        function onMonthChange() {
            const select = document.getElementById('monthSelect');
            currentMonthKey = select.value;
            const cycle = getCycleInfo(currentMonthKey);

            document.getElementById('currentMonthBadge').textContent = `${cycle.yearNum}年 ${cycle.monthNum < 10 ? '0'+cycle.monthNum : cycle.monthNum}月`;
            document.getElementById('activeSemesterTag').textContent = cycle.sem;
            document.getElementById('activeAcademicTag').textContent = cycle.acad;
            document.getElementById('activeYearTag').textContent = cycle.yr;

            const noticeBox = document.getElementById('cycleChangeNotice');
            const noticeText = document.getElementById('cycleNoticeText');
            noticeBox.classList.add('d-none');

            if (currentMonthKey === '116-01') {
                noticeBox.classList.remove('d-none');
                noticeText.textContent = "提醒：116年01月起進入「116年度」新年度目標！但【學期型】指標仍屬於「115-1學期」。";
            } else if (currentMonthKey === '116-02') {
                noticeBox.classList.remove('d-none');
                noticeText.textContent = "提醒：116年02月起進入「115-2學期」，【學期型】指標數據開始填寫新學期目標與進度！";
            } else if (currentMonthKey === '116-08') {
                noticeBox.classList.remove('d-none');
                noticeText.textContent = "提醒：116年08月起進入「116-1學期」與「116學年度」，【學期型】與【學年型】指標進入全新階段！";
            }

            renderIndicators();
        }

        // 質化防寫鎖定切換
        function toggleQualitativeLock() {
            isQualitativeLocked = !isQualitativeLocked;
            const btn = document.getElementById('lockToggleBtn');
            const txt = document.getElementById('lockToggleText');
            const statusTxt = document.getElementById('qualitativeStatusText');

            if (isQualitativeLocked) {
                btn.className = "btn btn-sm btn-dark fw-bold d-flex align-items-center gap-1";
                txt.textContent = "常態月追蹤 (作文鎖定)";
                statusTxt.textContent = "🟢 常態月微亮點模式";
                statusTxt.className = "fs-5 fw-bold text-success mt-1";
            } else {
                btn.className = "btn btn-sm btn-danger fw-bold d-flex align-items-center gap-1";
                txt.textContent = "🚨 期末總結算 (開放作文)";
                statusTxt.textContent = "🚨 期末質化總結算模式";
                statusTxt.className = "fs-5 fw-bold text-danger mt-1";
            }
            renderIndicators();
        }

        // 面向頁籤切換
        function filterDim(dim) {
            currentDimFilter = dim;
            document.querySelectorAll('.dim-btn').forEach(btn => {
                if (btn.textContent.includes(dim) || (dim === 'ALL' && btn.textContent.includes('全部'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderIndicators();
        }

        // 渲染指標列表 (教務處藍色卡片 + 研發處標籤與欄位)
        function renderIndicators() {
            const container = document.getElementById('indicatorList');
            const typeFilter = document.getElementById('typeFilter').value;
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const cycle = getCycleInfo(currentMonthKey);

            container.innerHTML = "";

            const filtered = RAW_INDICATORS.filter(item => {
                const matchDim = (currentDimFilter === 'ALL' || item.dim === currentDimFilter);
                const matchType = (typeFilter === 'ALL' || item.type === typeFilter);
                const matchSearch = item.name.toLowerCase().includes(searchKeyword) || 
                                    item.group.toLowerCase().includes(searchKeyword) ||
                                    item.id.toLowerCase().includes(searchKeyword);
                return matchDim && matchType && matchSearch;
            });

            document.getElementById('totalIndicatorsCount').textContent = `${filtered.length} 項`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="card card-custom p-5 text-center text-muted fw-bold">查無符合條件之教務處指標項目</div>`;
                document.getElementById('avgProgressText').textContent = "0.0%";
                return;
            }

            let totalProgressSum = 0;
            let quantCount = 0;

            filtered.forEach(item => {
                let activeCycleName = item.cycle === '學期' ? cycle.sem : (item.cycle === '學年度' ? cycle.acad : cycle.yr);
                let cycleBadgeStyle = item.cycle === '學期' ? 'badge-semester' : (item.cycle === '學年度' ? 'badge-academic' : 'badge-year');

                const saved = storeData[item.id] || { val: "", target: 100, text: "", highlight: "" };

                const card = document.createElement('div');
                card.className = "card card-custom bg-white overflow-hidden";

                let innerHTML = `
                    <div class="card-header bg-light py-2 px-3 d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-secondary">${item.id}</span>
                            <span class="badge bg-primary">${item.dim}</span>
                            <span class="badge ${item.cat === '共同' ? 'bg-primary-subtle text-primary' : 'bg-success-subtle text-success'} border">${item.cat}指標</span>
                            <strong class="text-dark small ms-1">${item.group}</strong>
                        </div>
                        <div>
                            <span class="badge ${cycleBadgeStyle}">
                                ${item.cycle}型 | 當前對齊：${activeCycleName}
                            </span>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <div class="fw-bold text-dark mb-2">${item.name}</div>
                `;

                if (item.type === '量化') {
                    quantCount++;
                    const targetVal = parseFloat(saved.target) || 100;
                    const inputVal = parseFloat(saved.val) || 0;
                    const rate = Math.min(1000, Math.round((inputVal / targetVal) * 100));
                    totalProgressSum += Math.min(100, rate);

                    let barColor = rate >= 100 ? "bg-success" : (rate >= 80 ? "bg-warning" : "bg-danger");

                    innerHTML += `
                        <div class="row g-2 align-items-center bg-light p-2 rounded border">
                            <div class="col-md-2">
                                <label class="form-label text-muted small fw-bold mb-1">目標值 (${item.unit || '單位'})</label>
                                <input type="number" id="target_${item.id}" value="${saved.target || ''}" oninput="updateQuantData('${item.id}')" placeholder="填寫目標" class="form-control form-control-sm fw-bold">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-muted small fw-bold mb-1">當期實績數據</label>
                                <input type="number" id="val_${item.id}" value="${saved.val || ''}" oninput="updateQuantData('${item.id}')" placeholder="填寫實績" class="form-control form-control-sm fw-bold">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small fw-bold mb-1">${activeCycleName} 達成率</label>
                                <div class="d-flex align-items-center gap-2">
                                    <span id="rate_${item.id}" class="fw-bold small text-primary">${rate}%</span>
                                    <div class="progress progress-sm flex-grow-1">
                                        <div id="bar_${item.id}" class="progress-bar ${barColor}" style="width: ${Math.min(100, rate)}%"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label text-muted small fw-bold mb-1">佐證檔案上傳</label>
                                <input type="file" class="form-control form-control-sm">
                            </div>
                        </div>
                    `;
                } else {
                    // 質化指標
                    if (isQualitativeLocked) {
                        innerHTML += `
                            <div class="is-locked-bg p-3 rounded">
                                <div class="d-flex justify-between align-items-center mb-1">
                                    <span class="text-muted small fw-bold"><i class="bi bi-lock-fill text-warning me-1"></i>常態月追蹤期 (質化作文鎖定中，期末結算開展)</span>
                                </div>
                                <div>
                                    <label class="form-label text-dark small fw-bold mb-1">💡 當月 50字微亮點 (選填輕量留痕)</label>
                                    <input type="text" id="hl_${item.id}" value="${saved.highlight || ''}" onchange="updateQualHighlight('${item.id}')" maxlength="50" placeholder="以一句話簡述當月推動微成果..." class="form-control form-control-sm">
                                </div>
                            </div>
                        `;
                    } else {
                        innerHTML += `
                            <div class="bg-danger bg-opacity-10 p-3 rounded border border-danger border-opacity-25">
                                <div class="text-danger small fw-bold mb-2"><i class="bi bi-unlock-fill me-1"></i>🚨 期末官方結算期 (請填寫完整執行策略與具體成果說明)</div>
                                <textarea id="txt_${item.id}" onchange="updateQualText('${item.id}')" rows="2" placeholder="請詳細說明 ${activeCycleName} 內執行情形..." class="form-control form-control-sm mb-2">${saved.text || ''}</textarea>
                                <input type="file" class="form-control form-control-sm">
                            </div>
                        `;
                    }
                }

                innerHTML += `</div>`;
                card.innerHTML = innerHTML;
                container.appendChild(card);
            });

            const avgProgress = quantCount > 0 ? (totalProgressSum / quantCount).toFixed(1) : "0.0";
            document.getElementById('avgProgressText').textContent = `${avgProgress}%`;
        }

        // 數據更新 handlers
        function updateQuantData(id) {
            const target = document.getElementById(`target_${id}`).value;
            const val = document.getElementById(`val_${id}`).value;

            if (!storeData[id]) storeData[id] = {};
            storeData[id].target = target;
            storeData[id].val = val;

            const targetVal = parseFloat(target) || 100;
            const inputVal = parseFloat(val) || 0;
            const rate = Math.min(1000, Math.round((inputVal / targetVal) * 100));

            const rateElem = document.getElementById(`rate_${id}`);
            const barElem = document.getElementById(`bar_${id}`);

            if (rateElem) rateElem.textContent = `${rate}%`;
            if (barElem) {
                barElem.style.width = `${Math.min(100, rate)}%`;
                barElem.className = rate >= 100 ? "progress-bar bg-success" : (rate >= 80 ? "progress-bar bg-warning" : "progress-bar bg-danger");
            }
        }

        function updateQualHighlight(id) {
            const hl = document.getElementById(`hl_${id}`).value;
            if (!storeData[id]) storeData[id] = {};
            storeData[id].highlight = hl;
        }

        function updateQualText(id) {
            const txt = document.getElementById(`txt_${id}`).value;
            if (!storeData[id]) storeData[id] = {};
            storeData[id].text = txt;
        }

        function saveAllData() {
            localStorage.setItem('FYU_SPROUT_DATA_AA', JSON.stringify(storeData));
            alert(`【教務處】已成功將 ${currentMonthKey} 月份填報數據暫存於瀏覽器快取！`);
        }

        function exportCSV() {
            let csvContent = "\uFEFF指標編號,面向,指標項目,衡量方式,週期類型,當前對齊週期,類型,目標值,當期數據,達成率,質化說明/微亮點\n";
            const cycle = getCycleInfo(currentMonthKey);

            RAW_INDICATORS.forEach(item => {
                const saved = storeData[item.id] || {};
                let cycleName = item.cycle === '學期' ? cycle.sem : (item.cycle === '學年度' ? cycle.acad : cycle.yr);

                let target = saved.target || '';
                let val = saved.val || '';
                let rate = (val && target) ? Math.round((parseFloat(val)/parseFloat(target))*100) + '%' : '';
                let desc = (item.type === '質化') ? (saved.text || saved.highlight || '') : '';
                desc = `"${desc.replace(/"/g, '""')}"`;

                csvContent += `${item.id},${item.dim},${item.group},"${item.name}",${item.cycle},${cycleName},${item.type},${target},${val},${rate},${desc}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `輔英科大高教深耕指標填報_教務處_${currentMonthKey}.csv`;
            link.click();
        }

        // 初始化
        window.onload = function() {
            const local = localStorage.getItem('FYU_SPROUT_DATA_AA');
            if (local) {
                try { storeData = JSON.parse(local); } catch(e){}
            }
            onMonthChange();
        };
    </script>
</body>
</html>
